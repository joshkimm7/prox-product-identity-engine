[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prox-product-identity"
version = "0.1.0"
description = "Offline, explainable cross-retailer grocery product matching engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

